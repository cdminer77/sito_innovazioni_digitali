<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Circular background for great contrast on any browser tab -->
  <rect width="100" height="100" rx="22" fill="#070b13" />
  
  <!-- "i" dot: open ring in teal -->
  <circle cx="50" cy="22" r="9" stroke="#00c9b7" stroke-width="4.5" fill="none" />
  
  <!-- Left side of stem: slate grey circuit -->
  <!-- Top left flag / serif -->
  <path d="M 47 37 L 38 37 C 42 39 44 42 44 46 L 44 80 L 37 80 L 37 84 L 47 84 Z" fill="#94a3b8" />
  <!-- Circuit node 1 left -->
  <path d="M 44 49 L 34 43" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="33" cy="42" r="3.5" stroke="#94a3b8" stroke-width="2" fill="#070b13" />
  <!-- Circuit node 2 left -->
  <path d="M 44 59 L 30 52" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="29" cy="51" r="3.5" stroke="#94a3b8" stroke-width="2" fill="#070b13" />
  
  <!-- Right side of stem: vibrant teal circuit -->
  <path d="M 52 37 L 57 37 L 57 80 L 63 80 L 63 84 L 52 84 Z" fill="#00c9b7" />
  <!-- Circuit node 1 right -->
  <path d="M 57 49 L 66 54" stroke="#00c9b7" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="67" cy="55" r="3.5" stroke="#00c9b7" stroke-width="2" fill="#070b13" />
  <!-- Circuit node 2 right -->
  <path d="M 57 60 L 71 67" stroke="#00c9b7" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="72" cy="68" r="3.5" stroke="#00c9b7" stroke-width="2" fill="#070b13" />
</svg>